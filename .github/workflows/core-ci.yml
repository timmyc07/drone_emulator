name: core-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install cmake ninja
      - name: Validate
        run: bash tools/validation/validate_macos.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ctest-macos
          path: build/macos-arm64-debug/Testing/Temporary/
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate
        shell: pwsh
        run: ./tools/validation/validate_windows.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ctest-windows
          path: build/windows-x64-debug/Testing/Temporary/
