name: core-ci
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install cmake ninja
      - name: Configure
        run: cmake --preset macos-arm64-debug
      - name: Build
        run: cmake --build --preset macos-arm64-debug
      - name: Test
        run: ctest --preset macos-arm64-debug --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-x64-debug
      - name: Build
        run: cmake --build --preset windows-x64-debug
      - name: Test
        run: ctest --preset windows-x64-debug --output-on-failure
